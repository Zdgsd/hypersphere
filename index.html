<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypersphere (4D) Visualization - Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070b14; color: #e6edf3; font-family: Inter, system-ui, sans-serif; }
    #app { width: 100%; height: 100%; }
    .hud {
      position: fixed; top: 12px; left: 12px; background: rgba(10,14,25,.72); border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; backdrop-filter: blur(4px);
    }
    .hud h1 { margin: 0 0 6px 0; font-size: 14px; }
    .legend { margin-top: 6px; }
    .dim { display: flex; align-items: center; gap: 8px; }
    .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .slider-wrap { margin-top: 8px; }
    input[type="range"] { width: 220px; }
    .note { opacity: .85; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <h1>4D Hypersphere (3-Sphere) — 3D Projection</h1>
    <div><strong>Equation:</strong> x₁² + x₂² + x₃² + x₄² = R²</div>
    <div class="legend">
      <div class="dim"><span class="sw" style="background:#ff4d4d"></span> <strong>1</strong> → x₁ (red axis)</div>
      <div class="dim"><span class="sw" style="background:#48e173"></span> <strong>2</strong> → x₂ (green axis)</div>
      <div class="dim"><span class="sw" style="background:#53a3ff"></span> <strong>3</strong> → x₃ (blue axis)</div>
      <div class="dim"><span class="sw" style="background:linear-gradient(90deg,#6f42c1,#ffd43b)"></span> <strong>4</strong> → x₄ (color + slice slider)</div>
    </div>
    <div class="slider-wrap">
      <label for="x4"><strong>D4 (x₄ slice):</strong> <span id="x4val">0.00</span></label><br/>
      <input id="x4" type="range" min="-1" max="1" value="0" step="0.01" />
    </div>
    <div>
      <label><input id="autoplay" type="checkbox" checked /> Auto animate x₄</label>
    </div>
    <div class="note">Drag to orbit • Scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 8, 3);
    scene.add(dir);

    // Axes for D1/D2/D3
    const axes = new THREE.Group();
    const axisLen = 2.2;
    const axisMat = (c) => new THREE.LineBasicMaterial({ color: c });
    const makeAxis = (from, to, color) => {
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      return new THREE.Line(geo, axisMat(color));
    };
    axes.add(makeAxis(new THREE.Vector3(-axisLen,0,0), new THREE.Vector3(axisLen,0,0), 0xff4d4d)); // x1
    axes.add(makeAxis(new THREE.Vector3(0,-axisLen,0), new THREE.Vector3(0,axisLen,0), 0x48e173)); // x2
    axes.add(makeAxis(new THREE.Vector3(0,0,-axisLen), new THREE.Vector3(0,0,axisLen), 0x53a3ff)); // x3
    scene.add(axes);

    function makeLabel(text, color) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = color;
      ctx.font = 'bold 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(0.35,0.35,0.35);
      return sp;
    }

    const l1 = makeLabel('1', '#ff8080'); l1.position.set(axisLen + .25, 0, 0);
    const l2 = makeLabel('2', '#7bf59d'); l2.position.set(0, axisLen + .25, 0);
    const l3 = makeLabel('3', '#8fc4ff'); l3.position.set(0, 0, axisLen + .25);
    const l4 = makeLabel('4', '#ffd43b'); l4.position.set(-1.8, 1.8, 0);
    scene.add(l1,l2,l3,l4);

    const R = 1.6;
    const points = new THREE.Group();
    scene.add(points);

    const sphereWire = new THREE.Mesh(
      new THREE.SphereGeometry(R, 48, 24),
      new THREE.MeshBasicMaterial({ color: 0x8aa1ff, wireframe: true, transparent: true, opacity: 0.12 })
    );
    scene.add(sphereWire);

    const x4Slider = document.getElementById('x4');
    const x4Val = document.getElementById('x4val');
    const autoplay = document.getElementById('autoplay');

    function colorForX4(v) {
      const t = (v + 1) / 2;
      const c1 = new THREE.Color(0x6f42c1);
      const c2 = new THREE.Color(0xffd43b);
      return c1.lerp(c2, t);
    }

    function rebuildSlice(x4) {
      while (points.children.length) points.remove(points.children[0]);
      const r3 = Math.sqrt(Math.max(0, R*R - (x4*R)*(x4*R)));

      const geo = new THREE.SphereGeometry(r3, 40, 20);
      const mat = new THREE.MeshStandardMaterial({
        color: colorForX4(x4),
        transparent: true,
        opacity: 0.4,
        roughness: 0.4,
        metalness: 0.05,
      });
      const mesh = new THREE.Mesh(geo, mat);
      points.add(mesh);

      const wire = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ color: colorForX4(x4), wireframe: true, transparent: true, opacity: 0.45 })
      );
      points.add(wire);

      x4Val.textContent = Number(x4).toFixed(2);
    }

    rebuildSlice(0);

    x4Slider.addEventListener('input', () => rebuildSlice(parseFloat(x4Slider.value)));

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      if (autoplay.checked) {
        t += 0.01;
        const v = Math.sin(t);
        x4Slider.value = v.toFixed(2);
        rebuildSlice(v);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
